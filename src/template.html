<script>
/* 主题在首屏渲染前就恢复，避免深色用户看到一闪而过的白底 */
(function () {
  try {
    if (localStorage.getItem('wl-mgr-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) { /* 隐私模式下读不到就按浅色走 */ }
})();
</script>
